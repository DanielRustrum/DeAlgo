{# Removal only ever happens because someone pressed this. #}
<div class="watched-actions">
  <form method="post" action="/playlist/remove-watched" hx-post="/playlist/remove-watched"
        hx-target="#sync-controls" hx-swap="outerHTML"
        hx-confirm="Remove {{ removable_count }} watched video{{ 's' if removable_count != 1 }} from the playlist? De-Algo keeps their record, so they will not come back on the next sync.">
    <button class="btn {{ 'btn-primary' if removable_count else '' }}" type="submit"
            {{ 'disabled' if not removable_count }}>
      Remove {{ removable_count }} watched from playlist
    </button>
  </form>
  <form method="post" action="/playlist/mark-all-watched" hx-post="/playlist/mark-all-watched"
        hx-target="#sync-controls" hx-swap="outerHTML"
        hx-confirm="Mark everything currently in the playlist as watched?">
    <button class="btn btn-quiet" type="submit">Mark playlist watched</button>
  </form>
</div>
