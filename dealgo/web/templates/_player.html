{# Replaces a card's thumbnail once someone chooses to watch it. #}
<div class="card-player">
  <iframe
    src="https://www.youtube-nocookie.com/embed/{{ video.video_id }}?autoplay=1&rel=0"
    title="{{ video.title }}"
    {# No picture-in-picture: the browser floats its pop-out button over the
       player, on top of YouTube's fullscreen control. A cross-origin iframe is
       denied PiP by default, so simply not asking for it is the fix. #}
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen loading="lazy"></iframe>
</div>
