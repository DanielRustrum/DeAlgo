[project]
name = "dealgo"
version = "0.1.0"
description = "Mirror chosen YouTube channels into a playlist, so your feed is yours and not the algorithm's."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dealgo = "dealgo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealgo*"]

# Templates and static assets ship inside the package, so the installed
# app is self-contained (this is what the container runs).
[tool.setuptools.package-data]
dealgo = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
