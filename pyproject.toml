[project]
name = "dealgo"
version = "0.1.0"
description = "Mirror chosen YouTube channels into a playlist, so your feed is yours and not the algorithm's."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    # Fernet, for the encrypted site backup. Nothing else here needs a
    # cipher, and hand-rolling one to avoid a dependency would be worse.
    "cryptography>=42",
]

[project.optional-dependencies]
# libsass compiles web/scss into static/app.css. The app itself never imports
# it: the compiled stylesheet is committed and ships in the package, so running
# De-Algo needs no compiler — only restyling it does.
dev = ["pytest>=8.0", "libsass>=0.22", "mypy>=1.11"]
# pdoc builds the Python half of docs/internal/autodoc from the docstrings.
docs = ["pdoc==16.0.0"]

[project.scripts]
dealgo = "dealgo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealgo*"]

# Templates and static assets ship inside the package, so the installed
# app is self-contained (this is what the container runs).
[tool.setuptools.package-data]
# These globs are not recursive: `web/static/*` does not reach web/static/icons,
# which is how the app icons were left out of the image the first time.
dealgo = [
    "py.typed",
    "web/templates/*.html",
    "web/static/*",
    "web/static/icons/*",
    "web/scss/*.scss",
    "web/ts/*.ts",
    # Without this the image ships with no plugins at all, and every kind of
    # source stops being recognised — the app would start and understand
    # nothing you typed. Recursive, because a plugin is a folder of its own
    # and may carry more than one file: the flat `*.lua` this used to be
    # matched nothing once they moved, and the image shipped without them.
    "plugins/builtin/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Opts out of the guard that stops every other test reaching for a live
    # page. Only the tests about that reading itself wear it, and each one
    # feeds the page it wants to be given.
    "reads_pages: this test drives a plugin's own page reading",
]
filterwarnings = [
    # The per-owner unique indexes are expression-based (COALESCE), which
    # SQLAlchemy's reflection skips with a warning. Nothing reads them back.
    "ignore:Skipped unsupported reflection of expression-based index:Warning",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["dealgo"]
# Point at the real line rather than the top of the file.
pretty = true
show_error_codes = true

# Three dependencies ship no type information we can use. Naming them here
# keeps `strict` meaningful everywhere else: the gap is declared, not waved
# through globally.
#
# lupa has a `types-lupa` on PyPI, and it is behind the wheel we install: it
# does not know `max_memory`, `register_eval` or `register_builtins`, all of
# which lupa 2.8 has and this depends on. A stub that is wrong about the API
# is worse than no stub, so the module is untyped here on purpose and every
# value crossing out of it is checked in `runtime`.
[[tool.mypy.overrides]]
module = ["sass", "apscheduler.*", "lupa"]
ignore_missing_imports = true

